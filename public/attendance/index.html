<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Attendance</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Attendance</h1><p class="muted">Record daily attendance for your assigned class or the school.</p></div><input id="date" type="date"><button id="load">Load</button></div><div id="msg"></div><div class="card table-wrap"><table><thead><tr><th>Admission</th><th>Student</th><th>Class</th><th>Status</th><th>Note</th><th>Save</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["teacher","admin","hod"].includes(m.role))throw new Error("Attendance entry is for teachers/admin.");$("#date").value=new Date().toISOString().slice(0,10);async function load(){const d=await api("/api/attendance/list?date="+$("#date").value);$("#rows").innerHTML=d.map(s=>`<tr><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td><select class="status" data-id="${s.id}">${["Present","Absent","Late","Excused"].map(x=>`<option ${s.status===x?"selected":""}>${x}</option>`).join("")}</select></td><td><input class="note" data-id="${s.id}" value="${esc(s.note)}"></td><td><button class="save" data-id="${s.id}">Save</button></td></tr>`).join("");$$(".save").forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const status=$(`.status[data-id="${id}"]`).value,note=$(`.note[data-id="${id}"]`).value;await api("/api/attendance/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_id:id,attendance_date:$("#date").value,status,note})});b.textContent="Saved";setTimeout(()=>b.textContent="Save",1000)})}$("#load").onclick=load;$("#date").onchange=load;load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
