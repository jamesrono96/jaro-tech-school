<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Administration</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Administration</h1><p class="muted">Manage students, teachers, classes and school structure.</p></div><button id="newStudent">+ Add student</button></div><div class="grid"><div class="card"><div class="kpi">Students</div><div id="sc" class="num">—</div></div><div class="card"><div class="kpi">Teachers</div><div id="tc" class="num">—</div></div><div class="card"><div class="kpi">Assessments</div><div id="ac" class="num">—</div></div><div class="card"><div class="kpi">Marks</div><div id="mc" class="num">—</div></div></div><div id="msg"></div>
<div class="card"><div class="toolbar"><h2>Students</h2><input id="search" placeholder="Search name/admission"></div><div class="table-wrap"><table><thead><tr><th>Admission</th><th>Name</th><th>Class</th><th>Parent</th><th>Status</th></tr></thead><tbody id="students"></tbody></table></div></div>
<div class="card"><h2>Teachers</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Class</th><th>Status</th></tr></thead><tbody id="teachers"></tbody></table></div></div>
<div id="modal" class="modal"><div class="modalbox"><h2>Add student</h2><form id="sf"><div class="formgrid"><div class="field"><label>Admission No.</label><input id="adm" required></div><div class="field"><label>Full name</label><input id="sn" required></div><div class="field"><label>Class</label><select id="scn"></select></div><div class="field"><label>Stream</label><select id="ss"><option>A</option><option>B</option></select></div><div class="field"><label>Parent name</label><input id="pn"></div><div class="field"><label>Parent email</label><input id="pe" type="email"></div></div><br><div class="actions"><button>Add student</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></div></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["admin","hod"].includes(m.role))throw new Error("Administration is restricted to administrators/HOD.");const modal=$("#modal"),cs=await api("/api/classes/list");fillSelect($("#scn"),[...new Map(cs.map(c=>[c.class_name,c])).values()],"class_name",c=>c.class_name);$("#newStudent").onclick=()=>modal.classList.add("show");$("#cancel").onclick=()=>modal.classList.remove("show");async function load(){const [d,t,a]=await Promise.all([api("/api/admin/students"),api("/api/admin/teachers"),api("/api/admin/demo-school")]);$("#sc").textContent=a.students;$("#tc").textContent=a.teachers;$("#ac").textContent=a.assessments;$("#mc").textContent=a.marks;const q=$("#search").value.toLowerCase();$("#students").innerHTML=d.students.filter(s=>(s.full_name+" "+s.admission_no).toLowerCase().includes(q)).slice(0,100).map(s=>`<tr><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td>${esc(s.parent_name||"")}<br><span class="small muted">${esc(s.parent_email||"")}</span></td><td><span class="badge ${s.active?"ok":"danger"}">${s.active?"Active":"Inactive"}</span></td></tr>`).join("");$("#teachers").innerHTML=t.teachers.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc((t.teachers.find(y=>y.id===x.id)&&"")||"")}${esc((awaitSubject(x.subject_id))||"")}</td><td>${esc(x.class_name)} ${esc(x.stream)}</td><td><span class="badge ${x.active?"ok":"danger"}">${x.active?"Active":"Inactive"}</span></td></tr>`).join("")}function awaitSubject(id){return subjectsCache?.find(s=>s.id===id)?.name||""}const subjectsCache=await api("/api/subjects/list");$("#search").oninput=load;$("#sf").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/students",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admission_no:$("#adm").value,full_name:$("#sn").value,class_name:$("#scn").value,stream:$("#ss").value,parent_name:$("#pn").value,parent_email:$("#pe").value})});modal.classList.remove("show");e.target.reset();show("#msg","Student added successfully.","success");load()}catch(e){show("#msg",e.message,"error")}};load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
