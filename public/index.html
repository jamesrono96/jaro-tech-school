<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><h1>School Dashboard</h1><p class="muted">Central school operations, marks, results, attendance and parent access.</p>
<div class="grid">
<div class="card"><div class="kpi">Students</div><div id="students" class="num">—</div></div>
<div class="card"><div class="kpi">Teachers</div><div id="teachers" class="num">—</div></div>
<div class="card"><div class="kpi">Subjects</div><div id="subjects" class="num">—</div></div>
<div class="card"><div class="kpi">Assessments</div><div id="assessments" class="num">—</div></div></div>
<div class="card"><h2>My workspace</h2><div id="actions" class="actions"></div></div>
<div id="school" class="card"></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage(),d=await api("/api/dashboard/summary");$("#students").textContent=d.students;$("#teachers").textContent=d.teachers;$("#subjects").textContent=d.subjects;$("#assessments").textContent=d.assessments;const actionMap={teacher:[["/teacher/","Teacher Portal"],["/attendance/","Attendance"],["/timetable/","My Timetable"],["/reports/","My Reports"]],parent:[["/parent/","My Children & Results"],["/reports/","Report Forms"]],admin:[["/admin/","Administration"],["/assessments/","Assessments"],["/approval/","Results Approval"],["/results/","Results Analysis"],["/timetable/","Timetable"]],hod:[["/admin/","Administration"],["/approval/","Results Approval"],["/results/","Results Analysis"],["/timetable/","Timetable"]],exam_officer:[["/approval/","Results Approval"],["/results/","Results Analysis"],["/reports/","Reports"]]};$("#actions").innerHTML=(actionMap[m.role]||[]).map(x=>`<a class="btn" href="${x[0]}">${x[1]}</a>`).join("");$("#school").innerHTML=`<h2>${esc(d.school.name)}</h2><p><b>Curriculum:</b> ${esc(d.school.curriculum)} &nbsp; <b>Term:</b> ${esc(d.school.current_term)} &nbsp; <b>Academic Year:</b> ${esc(d.school.academic_year)}</p><p class="muted">Signed in as ${esc(m.role)}.</p>`}catch(e){}})();</script></body></html>
