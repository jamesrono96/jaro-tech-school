<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech School Management</title><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#10233f}.top{background:#10233f;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1150px;margin:auto;padding:25px 5%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:18px;border-radius:14px;border:1px solid #e3e8ef}.num{font-size:30px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{padding:13px;border:1px solid #e1e6ed;background:white;border-radius:9px;text-decoration:none;color:#10233f;font-weight:700}@media(max-width:700px){.grid,.actions{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><div class=top><b>Jaro-Tech School Management</b><span id=who></span></div><main class=wrap><h1>School Dashboard</h1><div class=grid><div class=card>Students<div class=num id=s>—</div></div><div class=card>Teachers<div class=num id=t>—</div></div><div class=card>Subjects<div class=num id=sub>—</div></div><div class=card>Role<div class=num id=role>—</div></div></div><div class=card style="margin-top:18px"><h2>Modules</h2><div class=actions><a class=btn href="/teacher/">Teacher Portal</a><a class=btn href="/results/">Results</a><a class=btn href="/reports/">Reports</a><a class=btn href="/attendance/">Attendance</a><a class=btn href="/timetable/">Timetable</a><a class=btn href="/parent/">Parent Portal</a><a class=btn href="/admin/">Administration</a><a class=btn href="/assessments/">Assessments</a><a class=btn href="/approval/">Approval</a></div></div></main><script>async function boot(){let r=await fetch('/api/account/me');if(r.status===401)return location='/login.html';let m=await r.json(),d=await(await fetch('/api/dashboard/summary')).json();who.textContent=m.display_name+' · '+m.role;s.textContent=d.students;t.textContent=d.teachers;sub.textContent=d.subjects;role.textContent=d.role}boot()</script></body></html>
