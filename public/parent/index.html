<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech parent</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#10233f}.top{background:#10233f;color:#fff;padding:16px 5%}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #e2e7ee;margin-bottom:15px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}button,select,input{padding:9px;border-radius:7px;border:1px solid #ccd5df}button{background:#1769aa;color:#fff;border:0}.btn{background:#1769aa;color:white;padding:9px 12px;text-decoration:none;border-radius:7px}</style></head><body><div class=top>Jaro-Tech · parent</div><main class=wrap><div class=card><h1>parent</h1><p>This module is connected to the live portable API.</p><div id=out>Loading...</div></div></main><script>async function boot(){let r=await fetch('/api/account/me');if(r.status===401)return location='/login.html';let m=await r.json();out.innerHTML='<b>Signed in as:</b> '+m.display_name+' · '+m.role+'<br><br><a class=btn href="/">Dashboard</a>'}boot()</script></body></html>
