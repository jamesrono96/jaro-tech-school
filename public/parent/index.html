<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Parent Portal</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><h1>Parent Portal</h1><p class="muted">View only children linked to this parent account and approved results.</p><div id="msg"></div><div id="children" class="grid3"></div><div id="detail"></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(m.role!=="parent")throw new Error("Sign in using a parent account.");const d=await api("/api/parent/dashboard");$("#children").innerHTML=d.children.map(c=>`<div class="card"><h2>${esc(c.full_name)}</h2><p>${esc(c.admission_no)} · ${esc(c.class_name)} ${esc(c.stream)}</p><p><b>Average:</b> ${fmt(c.average)}% &nbsp; <b>Approved entries:</b> ${c.entries}</p><button class="view" data-id="${c.id}">View report</button></div>`).join("");async function view(id){const x=await api("/api/results/student?student_id="+id);$("#detail").innerHTML=`<div class="card report"><div class="report-head"><h1>${esc(x.student.school_name)}</h1><h2>Student Progress Report</h2><p>${esc(x.student.current_term)}</p></div><div class="report-meta"><div><b>Name:</b> ${esc(x.student.full_name)}</div><div><b>Admission:</b> ${esc(x.student.admission_no)}</div><div><b>Class:</b> ${esc(x.student.class_name)} ${esc(x.student.stream)}</div><div><b>Average:</b> ${fmt(x.average)}%</div></div><table><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>%</th><th>Grade</th><th>Remark</th></tr></thead><tbody>${x.results.map(r=>`<tr><td>${esc(r.subject_name)}</td><td>${esc(r.assessment_name)}</td><td>${r.score}/${r.max_score}</td><td>${fmt(r.percentage)}%</td><td>${r.grade}</td><td>${esc(r.remark)}</td></tr>`).join("")}</tbody></table><br><button onclick="window.print()">Print / Save PDF</button></div>`}$$(".view").forEach(b=>b.onclick=()=>view(b.dataset.id));if(d.children[0])view(d.children[0].id)}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
