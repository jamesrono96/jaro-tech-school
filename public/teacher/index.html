<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Teacher Portal</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Teacher Portal</h1><p class="muted">Enter and submit marks for your assigned subject and class.</p></div></div>
<div id="info" class="card"></div><div class="card"><div class="toolbar"><select id="assessment"></select><button id="load">Load class</button></div><div id="msg"></div><div class="table-wrap"><table><thead><tr><th>Admission</th><th>Student</th><th>Class</th><th>Score</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><br><button id="save" class="success">Save Marks</button></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["teacher","admin","hod"].includes(m.role))throw new Error("This page is for teachers and school administrators.");const w=await api("/api/teacher/workspace");$("#info").innerHTML=`<h2>${esc(w.teacher.full_name)}</h2><p><b>Subject:</b> ${esc(w.subjects.find(s=>s.id===w.teacher.subject_id)?.name||"")} &nbsp; <b>Class:</b> ${esc(w.teacher.class_name)} ${esc(w.teacher.stream)}</p>`;fillSelect($("#assessment"),w.assessments,"id",a=>`${a.name} · ${w.subjects.find(s=>s.id===a.subject_id)?.name||""} · Max ${a.max_score}`,"Select assessment");let loaded=[];async function load(){const id=$("#assessment").value;if(!id)return;loaded=w.students;const ms=await api("/api/marks/list?assessment_id="+encodeURIComponent(id));const map=new Map(ms.map(x=>[x.student_id,x]));$("#rows").innerHTML=loaded.map(s=>{const x=map.get(s.id);return `<tr><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td><input class="score" data-id="${s.id}" type="number" min="0" max="100" value="${x?x.score:""}" ${x?.locked?"disabled":""}></td><td>${x?.locked?'<span class="badge ok">Locked</span>':'<span class="badge">Editable</span>'}</td></tr>`}).join("")}$("#load").onclick=load;$("#save").onclick=async()=>{try{const id=$("#assessment").value;if(!id)return;const rows=$$(".score").map(i=>({student_id:i.dataset.id,score:i.value}));const d=await api("/api/marks/bulk-save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assessment_id:id,rows})});show("#msg",`${d.saved} marks saved. They now await approval.`,"success");await load()}catch(e){show("#msg",e.message,"error")}};await load()}catch(e){show("#info",e.message,"error")}})();</script></body></html>
