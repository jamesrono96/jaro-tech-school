<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Results Approval</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Results Approval</h1><p class="muted">Review submitted marks and approve/lock an assessment.</p></div><select id="assessment"></select><button id="refresh">Refresh</button></div><div class="grid3"><div class="card"><div class="kpi">Submitted</div><div id="submitted" class="num">—</div></div><div class="card"><div class="kpi">Approved</div><div id="approved" class="num">—</div></div><div class="card"><div class="kpi">Locked</div><div id="locked" class="num">—</div></div></div><div id="msg"></div><div class="card"><h2>Unlock requests</h2><div id="unlockRequests" class="table-wrap"></div></div><div class="card"><button id="approve" class="success">Approve & Lock Selected Assessment</button><p class="muted small">Approval makes marks visible to parents and prevents further teacher editing.</p></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["admin","hod","exam_officer"].includes(m.role))throw new Error("Only HOD/exam/admin users can approve results.");const ad=await api("/api/admin/assessments"),sub=await api("/api/subjects/list");fillSelect($("#assessment"),ad.assessments,"id",a=>`${a.name} · ${sub.find(s=>s.id===a.subject_id)?.name||""} · ${a.status}`,"Select assessment");async function load(){if(!$("#assessment").value)return;const d=await api("/api/results/approval?assessment_id="+$("#assessment").value);$("#submitted").textContent=d.submitted;$("#approved").textContent=d.approved;$("#locked").textContent=d.locked;const ur=await api("/api/admin/unlock-requests");const relevant=ur.requests.filter(r=>r.assessment_id===$("#assessment").value);$("#unlockRequests").innerHTML=relevant.length?`<table><thead><tr><th>Teacher</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>${relevant.map(r=>`<tr><td>${esc(r.teacher)}</td><td>${esc(r.reason)}</td><td>${esc(r.status)}</td><td>${r.status==='pending'?`<button class="approve-unlock" data-id="${r.id}">Approve Unlock</button> <button class="reject-unlock secondary" data-id="${r.id}">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">No unlock requests for this assessment.</p>`;$$('.approve-unlock').forEach(b=>b.onclick=async()=>{await api('/api/admin/unlock-requests/'+b.dataset.id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:'approve'})});show('#msg','Assessment unlocked for correction.','success');load()});$$('.reject-unlock').forEach(b=>b.onclick=async()=>{await api('/api/admin/unlock-requests/'+b.dataset.id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:'reject'})});show('#msg','Unlock request rejected.','success');load()})}$("#refresh").onclick=load;$("#assessment").onchange=load;$("#approve").onclick=async()=>{if(!$("#assessment").value)return;try{const d=await api("/api/results/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assessment_id:$("#assessment").value})});show("#msg",`${d.approved} marks approved and locked.`,"success");load()}catch(e){show("#msg",e.message,"error")}};await load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
