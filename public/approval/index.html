<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Results Approval</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Results Approval</h1><p class="muted">Review submitted marks and approve/lock an assessment.</p></div><select id="assessment"></select><button id="refresh">Refresh</button></div><div class="grid3"><div class="card"><div class="kpi">Submitted</div><div id="submitted" class="num">—</div></div><div class="card"><div class="kpi">Approved</div><div id="approved" class="num">—</div></div><div class="card"><div class="kpi">Locked</div><div id="locked" class="num">—</div></div></div><div id="msg"></div><div class="card"><button id="approve" class="success">Approve & Lock Selected Assessment</button><p class="muted small">Approval makes marks visible to parents and prevents further teacher editing.</p></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["admin","hod","exam_officer"].includes(m.role))throw new Error("Only HOD/exam/admin users can approve results.");const ad=await api("/api/admin/assessments"),sub=await api("/api/subjects/list");fillSelect($("#assessment"),ad.assessments,"id",a=>`${a.name} · ${sub.find(s=>s.id===a.subject_id)?.name||""} · ${a.status}`,"Select assessment");async function load(){if(!$("#assessment").value)return;const d=await api("/api/results/approval?assessment_id="+$("#assessment").value);$("#submitted").textContent=d.submitted;$("#approved").textContent=d.approved;$("#locked").textContent=d.locked}$("#refresh").onclick=load;$("#assessment").onchange=load;$("#approve").onclick=async()=>{if(!$("#assessment").value)return;try{const d=await api("/api/results/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assessment_id:$("#assessment").value})});show("#msg",`${d.approved} marks approved and locked.`,"success");load()}catch(e){show("#msg",e.message,"error")}};await load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
