<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Reports</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Report Forms</h1><p class="muted">Generate a printable student report form.</p></div><input id="search" placeholder="Search student"><button id="load">Find</button></div><div id="msg"></div><div class="card table-wrap"><table><thead><tr><th>Admission</th><th>Student</th><th>Class</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="report"></div></main><script src="/app.js"></script><script>(async()=>{try{await requirePage();async function load(){const d=await api("/api/students/list?search="+encodeURIComponent($("#search").value||""));$("#rows").innerHTML=d.students.slice(0,50).map(s=>`<tr><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td><button class="view" data-id="${s.id}">Generate</button></td></tr>`).join("");$$(".view").forEach(b=>b.onclick=()=>generate(b.dataset.id))}async function generate(id){try{const d=await api("/api/results/student?student_id="+id);$("#report").innerHTML=`<section class="report"><div class="report-head">${d.student.logoDataUrl?`<img class="school-logo" src="${d.student.logoDataUrl}" alt="School logo">`:""}<h1>${esc(d.student.school_name)}</h1><h2>Official Student Report Form</h2><p>${esc(d.student.current_term)}</p></div><div class="report-meta"><div><b>Student:</b> ${esc(d.student.full_name)}</div><div><b>Admission:</b> ${esc(d.student.admission_no)}</div><div><b>Class:</b> ${esc(d.student.class_name)} ${esc(d.student.stream)}</div><div><b>Average:</b> ${fmt(d.average)}%</div></div><table><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>Percentage</th><th>Grade</th><th>Remark</th></tr></thead><tbody>${d.results.map(r=>`<tr><td>${esc(r.subject_name)}</td><td>${esc(r.assessment_name)}</td><td>${r.score}/${r.max_score}</td><td>${fmt(r.percentage)}%</td><td>${r.grade}</td><td>${esc(r.remark)}</td></tr>`).join("")}</tbody></table><p class="small muted">Generated from the Jaro-Tech School Management System.</p><button class="no-print" onclick="window.print()">Print / Save PDF</button></section>`}catch(e){show("#msg",e.message,"error")}}$("#load").onclick=load;$("#search").oninput=load;load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
