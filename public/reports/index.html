<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Reports</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/print.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar no-print"><div><h1>Professional Report Forms</h1><p class="muted">Generate neat, institution-branded report forms for individual students.</p></div><input id="search" placeholder="Search student"><button id="load">Find</button></div><div id="msg" class="no-print"></div><div class="card table-wrap no-print"><table><thead><tr><th>Admission</th><th>Student</th><th>Class</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="report"></div></main>
<script src="/app.js"></script><script>(async()=>{try{await requirePage();async function load(){const d=await api('/api/students/list?search='+encodeURIComponent($('#search').value||''));$('#rows').innerHTML=d.students.slice(0,50).map(s=>`<tr><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td><button class="view" data-id="${s.id}">Generate</button></td></tr>`).join('');$$('.view').forEach(b=>b.onclick=()=>generate(b.dataset.id))}
function watermark(d){const root=$('#report');root.style.setProperty('--watermark-text',JSON.stringify(d.student.school_name||'INSTITUTION'));if(d.student.logoDataUrl)root.style.setProperty('--watermark-image',`url("${d.student.logoDataUrl}")`)}
async function generate(id){try{const d=await api('/api/results/student?student_id='+id);$('#report').innerHTML=`<section class="report"><div class="report-head">${d.student.logoDataUrl?`<img class="school-logo" src="${d.student.logoDataUrl}" alt="Institution logo">`:''}<h1>${esc(d.student.school_name||'Institution')}</h1><h2>OFFICIAL STUDENT REPORT FORM</h2><p>${esc(d.student.current_term||'Academic Term')}</p></div><div class="report-meta"><div><b>Student:</b> ${esc(d.student.full_name)}</div><div><b>Admission No.:</b> ${esc(d.student.admission_no)}</div><div><b>Class / Stream:</b> ${esc(d.student.class_name)} ${esc(d.student.stream)}</div><div><b>Overall Average:</b> <strong>${fmt(d.average)}%</strong></div></div><table><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>Percentage</th><th>Grade</th><th>Remark</th></tr></thead><tbody>${d.results.map(r=>`<tr><td>${esc(r.subject_name)}</td><td>${esc(r.assessment_name)}</td><td>${r.score}/${r.max_score}</td><td>${fmt(r.percentage)}%</td><td><b>${esc(r.grade)}</b></td><td>${esc(r.remark)}</td></tr>`).join('')||'<tr><td colspan="6">No approved results available.</td></tr>'}</tbody></table><div class="report-foot" style="display:grid"><div class="signature">Class Teacher</div><div class="signature">Head of Department / Exam Officer</div><div class="signature">Principal / Head Teacher</div></div><p class="small muted no-print">Generated from the Jaro-Tech School Management System.</p><button class="no-print" onclick="window.print()">Print / Save PDF</button></section>`;watermark(d)}catch(e){show('#msg',e.message,'error')}}$('#load').onclick=load;$('#search').oninput=load;load()}catch(e){show('#msg',e.message,'error')}})();</script></body></html>
