<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Assessments</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Assessments</h1><p class="muted">Create, review and manage tests and examinations.</p></div><button id="new">+ New assessment</button></div><div id="msg"></div>
<div class="card table-wrap"><table><thead><tr><th>Name</th><th>Subject</th><th>Term</th><th>Max</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="modal" class="modal"><div class="modalbox"><h2>New assessment</h2><form id="af"><div class="formgrid"><div class="field"><label>Name</label><input id="aname" required placeholder="CAT 2"></div><div class="field"><label>Subject</label><select id="asub" required></select></div><div class="field"><label>Term</label><input id="aterm" value="Term 2"></div><div class="field"><label>Maximum score</label><input id="amax" type="number" value="100" min="1"></div></div><br><div class="actions"><button>Create</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></div></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(!["admin","hod","exam_officer"].includes(m.role))throw new Error("Only assessment officers can manage assessments.");const modal=$("#modal");$("#new").onclick=()=>modal.classList.add("show");$("#cancel").onclick=()=>modal.classList.remove("show");const subs=await api("/api/subjects/list");fillSelect($("#asub"),subs,"id",s=>`${s.name} (${s.code})`);async function load(){const d=await api("/api/admin/assessments");$("#rows").innerHTML=d.assessments.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(subs.find(s=>s.id===a.subject_id)?.name||"")}</td><td>${esc(a.term)}</td><td>${a.max_score}</td><td><span class="badge ${a.status==="locked"?"ok":"warn"}">${esc(a.status)}</span></td><td>${a.status!=="locked"?`<button class="lock" data-id="${a.id}">Lock</button>`:"Locked"}</td></tr>`).join("");$$(".lock").forEach(b=>b.onclick=async()=>{await api("/api/admin/assessments/"+b.dataset.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"locked"})});load()})}$("#af").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/assessments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#aname").value,subject_id:$("#asub").value,term:$("#aterm").value,max_score:Number($("#amax").value)})});modal.classList.remove("show");e.target.reset();load();show("#msg","Assessment created.","success")}catch(e){show("#msg",e.message,"error")}};load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
