<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Register Institution</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="max-width:760px;margin:50px auto"><div class="card"><h1>Create Institution Account</h1><p class="muted">Register your school/institution and receive administrator credentials.</p><div id="msg"></div><form id="f"><div class="formgrid"><div class="field"><label>Institution name</label><input id="name" required></div><div class="field"><label>Administrator name</label><input id="admin" required></div><div class="field"><label>Administrator email</label><input id="email" type="email" required></div><div class="field"><label>Academic year</label><input id="year" value="2027"></div></div><br><button>Create institution</button></form><div id="result"></div><p class="small muted">Already have an account? <a href="/login.html">Sign in</a></p></div></main><script>const f=document.querySelector('#f'),msg=document.querySelector('#msg'),out=document.querySelector('#result');f.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';try{const r=await fetch('/api/public/institutions/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,admin_name:document.querySelector('#admin').value,admin_email:document.querySelector('#email').value,academic_year:document.querySelector('#year').value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error);out.innerHTML='<div class="credential-box"><b>Institution created.</b><p>Administrator email: <code>'+d.credentials.email+'</code><br>Temporary password: <code>'+d.credentials.password+'</code></p><p class="small muted">Save these credentials securely. Continue to the login page.</p><a class="button" href="/login.html">Go to login</a></div>';f.reset();}catch(e){msg.innerHTML='<div class="alert error">'+e.message+'</div>'}}</script></body></html>
