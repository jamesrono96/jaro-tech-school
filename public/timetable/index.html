<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Timetable</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Timetable</h1><p class="muted">School timetable by class, stream and day.</p></div><select id="class"></select><select id="day"><option value="">All days</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select><button id="load">Load</button></div><div id="msg"></div><div class="card table-wrap"><table><thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Room</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="/app.js"></script><script>(async()=>{try{await requirePage();const cs=await api("/api/classes/list");fillSelect($("#class"),cs,"class_name",c=>`${c.class_name} ${c.stream}`,"All classes");async function load(){let u="/api/timetable/list";const q=[];if($("#class").value)q.push("class_name="+encodeURIComponent($("#class").value));if($("#day").value)q.push("day="+encodeURIComponent($("#day").value));if(q.length)u+="?"+q.join("&");const d=await api(u);$("#rows").innerHTML=d.map(x=>`<tr><td>${esc(x.day_of_week)}</td><td>${x.period_no}</td><td>${x.start_time}–${x.end_time}</td><td>${esc(x.class_name)} ${esc(x.stream)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.teacher_name)}</td><td>${esc(x.room)}</td></tr>`).join("")}$("#load").onclick=load;load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
