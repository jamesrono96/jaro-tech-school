<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Timetable</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Timetable</h1><p class="muted">Administration can create the timetable. Teachers see only their assigned classes in their portal.</p></div><select id="class"></select><select id="stream"><option value="">All streams</option><option>A</option><option>B</option><option>C</option></select><select id="day"><option value="">All days</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select><button id="load">Load</button><button id="new" style="display:none">+ Add lesson</button></div><div id="msg"></div><div class="card table-wrap"><table><thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Room</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="modal" class="modal"><div class="modalbox"><h2>Add timetable lesson</h2><form id="tf"><div class="formgrid"><div class="field"><label>Class</label><select id="tclass"></select></div><div class="field"><label>Stream</label><select id="tstream"><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Day</label><select id="tday"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select></div><div class="field"><label>Period</label><input id="tperiod" type="number" min="1" max="12" value="1"></div><div class="field"><label>Start</label><input id="tstart" type="time" value="08:00"></div><div class="field"><label>End</label><input id="tend" type="time" value="08:40"></div><div class="field"><label>Subject</label><select id="tsub"></select></div><div class="field"><label>Teacher</label><select id="tteacher"></select></div><div class="field"><label>Room</label><input id="troom"></div></div><br><div class="actions"><button>Add lesson</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></div></div>
</main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();const isAdmin=["admin","hod"].includes(m.role);$("#new").style.display=isAdmin?"inline-block":"none";const cs=await api("/api/classes/list");fillSelect($("#class"),cs,"class_name",c=>c.class_name,"All grades");if(isAdmin){const d=await api("/api/admin/timetable");fillSelect($("#tclass"),[...new Map(cs.map(c=>[c.class_name,c])).values()],"class_name",c=>c.class_name);fillSelect($("#tsub"),d.subjects,"id",x=>x.name);fillSelect($("#tteacher"),d.teachers,"id",x=>x.full_name);$("#new").onclick=()=>$("#modal").classList.add("show");$("#cancel").onclick=()=>$("#modal").classList.remove("show");$("#tf").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/timetable",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({class_name:$("#tclass").value,stream:$("#tstream").value,day_of_week:$("#tday").value,period_no:Number($("#tperiod").value),start_time:$("#tstart").value,end_time:$("#tend").value,subject_id:$("#tsub").value,teacher_id:$("#tteacher").value,room:$("#troom").value})});$("#modal").classList.remove("show");show("#msg","Timetable lesson added.","success");load()}catch(e){show("#msg",e.message,"error")}}}async function load(){let u="/api/timetable/list";const q=[];if($("#class").value)q.push("class_name="+encodeURIComponent($("#class").value));if($("#stream").value)q.push("stream="+encodeURIComponent($("#stream").value));if($("#day").value)q.push("day="+encodeURIComponent($("#day").value));if(q.length)u+="?"+q.join("&");const d=await api(u);$("#rows").innerHTML=d.map(x=>`<tr><td>${esc(x.day_of_week)}</td><td>${x.period_no}</td><td>${esc(x.start_time)}–${esc(x.end_time)}</td><td>${esc(x.class_name)} ${esc(x.stream)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.teacher_name)}</td><td>${esc(x.room||"")}</td><td>${isAdmin?`<button class="delete" data-id="${x.id}">Delete</button>`:""}</td></tr>`).join("")||`<tr><td colspan="8">No timetable entries.</td></tr>`;if(isAdmin)$$('.delete').forEach(b=>b.onclick=async()=>{if(confirm("Delete this timetable lesson?")){await api("/api/admin/timetable/"+b.dataset.id,{method:"DELETE"});load()}})}$("#load").onclick=load;load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
