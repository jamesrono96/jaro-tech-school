<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech Login</title><link rel="stylesheet" href="/styles.css"></head><body><main class="login"><section class="loginbox">
<h1>Jaro-Tech</h1><p class="muted">School Management System</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><br><div class="field"><label>Password</label><input id="password" type="password" required></div><br><button style="width:100%">Sign in</button></form><div id="msg"></div><div class="demo"><b>Demo accounts</b><br>Admin: admin@demo.school / Admin123!<br>Teacher: alice.chebet@demo.school / Teacher123!<br>Parent: parent001@demo.school / Parent123!</div></section></main><script>
form.addEventListener("submit",async e=>{e.preventDefault();msg.innerHTML="Signing in...";try{await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message)});location="/"}catch(e){msg.innerHTML='<div class="alert error">'+e.message+"</div>"}});
</script></body></html>
