<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech Login</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;color:#10233f}.box{background:white;padding:30px;border-radius:18px;width:min(430px,90vw);box-shadow:0 10px 35px #0001}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccd5df}button{background:#1769aa;color:#fff;border:0;font-weight:700}.demo{background:#f5f7fb;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}</style></head><body><main class=box><h1>Jaro-Tech</h1><p>School Management System</p><form id=f><input id=email type=email placeholder="Email" required><input id=password type=password placeholder="Password" required><button>Sign in</button></form><p id=msg></p><div class=demo><b>Admin:</b> admin@demo.school / Admin123!<br><b>Teacher:</b> alice.chebet@demo.school / Teacher123!<br><b>Parent:</b> parent001@demo.school / Parent123!</div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();msg.textContent=r.ok?'Signed in...':d.message;if(r.ok)location='/';}</script></body></html>
