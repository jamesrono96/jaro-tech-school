<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaro-Tech · Results</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="top"><div class="brand">Jaro-Tech School Management System</div><div class="top-right"><span id="who">Loading...</span><button id="logout" class="secondary">Sign out</button></div></div><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="toolbar"><div><h1>Results</h1><p class="muted">Student performance overview and detailed results.</p></div><input id="search" placeholder="Search student/admission"><select id="class"></select><button id="load">Load</button></div><div id="msg"></div><div class="card table-wrap"><table><thead><tr><th>Position</th><th>Admission</th><th>Student</th><th>Class</th><th>Average</th><th>Grade</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="detail"></div></main><script src="/app.js"></script><script>(async()=>{try{const m=await requirePage();if(m.role==="parent"){location="/parent/";return}if(m.role==="teacher"){throw new Error("Teachers should use Teacher Portal for their assigned class.");}const cs=await api("/api/classes/list");fillSelect($("#class"),cs,"class_name",c=>`${c.class_name} ${c.stream}`,"All classes");async function load(){const d=await api("/api/results/overview"+($("#class").value?("?class_name="+encodeURIComponent($("#class").value)):""));const q=$("#search").value.toLowerCase();const rows=d.students.filter(s=>(s.full_name+" "+s.admission_no).toLowerCase().includes(q));$("#rows").innerHTML=rows.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.admission_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.class_name)} ${esc(s.stream)}</td><td>${fmt(s.average)}%</td><td><span class="badge">${s.grade}</span></td><td><button class="view" data-id="${s.id}">View</button></td></tr>`).join("");$$(".view").forEach(b=>b.onclick=()=>view(b.dataset.id))}async function view(id){const d=await api("/api/results/student?student_id="+id);$("#detail").innerHTML=`<div class="card"><div class="toolbar"><h2>${esc(d.student.full_name)}</h2><button onclick="window.print()" class="secondary">Print</button></div><p>${esc(d.student.admission_no)} · ${esc(d.student.class_name)} ${esc(d.student.stream)} · Average ${fmt(d.average)}%</p><div class="table-wrap"><table><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>%</th><th>Grade</th><th>Status</th></tr></thead><tbody>${d.results.map(x=>`<tr><td>${esc(x.subject_name)}</td><td>${esc(x.assessment_name)}</td><td>${x.score}/${x.max_score}</td><td>${fmt(x.percentage)}%</td><td>${x.grade}</td><td>${x.approved?"Approved":"Pending"}</td></tr>`).join("")}</tbody></table></div></div>`}$("#load").onclick=load;$("#search").oninput=load;await load()}catch(e){show("#msg",e.message,"error")}})();</script></body></html>
